name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # 上游 v8 起不再发布 v10 这样的主版本标签, 只能写全版本号
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Test (pytest)
        run: >-
          uv run pytest -v --cov=quanttoolskit --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-report=html --cov-report=markdown-append:$GITHUB_STEP_SUMMARY

      - name: Save coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        # Coverage service availability must not block lint, tests or package build.
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Build package
        run: uv build
