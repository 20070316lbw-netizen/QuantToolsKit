[project]
name = "quanttoolskit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "20070316lbw-netizen", email = "lbw20070316lbw@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
quanttoolskit = "quanttoolskit:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
